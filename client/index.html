<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Btp76D_yUaECRUsEVOaQacoYeOS_qJbtiKNFvjPCFnw" />
    <link rel="icon" type="image/png" sizes="1254x1254" href="/branding/ayanfe-food-variety-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/branding/ayanfe-food-variety-logo.png" />
    <link rel="apple-touch-icon" href="/branding/ayanfe-food-variety-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop quality food essentials, carefully selected for your everyday needs, with convenient pickup and delivery options." />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Ayanfe Food Variety" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ayanfe Food Variety | Quality Gluten-Free Foods" />
    <meta property="og:description" content="Shop quality food essentials, carefully selected for your everyday needs, with convenient pickup and delivery options." />
    <meta property="og:image" content="%PUBLIC_APP_URL%/branding/ayanfe-food-variety-logo.png" />
    <meta property="og:url" content="%PUBLIC_APP_URL%/" />
    <link rel="canonical" href="%PUBLIC_APP_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ayanfe Food Variety | Quality Gluten-Free Foods" />
    <meta name="twitter:description" content="Shop quality food essentials, carefully selected for your everyday needs, with convenient pickup and delivery options." />
    <meta name="twitter:image" content="%PUBLIC_APP_URL%/branding/ayanfe-food-variety-logo.png" />
    <title>Ayanfe Food Variety | Quality Gluten-Free Foods</title>
    <script>
      (() => {
        const siteUrl = '%PUBLIC_APP_URL%'.replace(/\/+$/, '')
        const path = window.location.pathname
        const params = new URLSearchParams(window.location.search)
        const isCleanCategory = path === '/shop' && params.has('category') && !params.has('search') && !params.has('sort') && !params.has('page')
        const canonicalPath = path === '/'
          ? '/'
          : path === '/about'
            ? '/about'
            : path === '/new-arrivals'
              ? '/new-arrivals'
              : isCleanCategory
                ? `${path}?category=${encodeURIComponent(params.get('category') || '')}`
                : path === '/shop'
                  ? '/shop'
                  : path
        const routeMeta = path === '/about'
          ? {
              title: 'About Ayanfe Food Variety | Gluten-Free Foodstuff',
              description: 'Ayanfe Food Variety offers carefully selected gluten-free foodstuff and pantry essentials for everyday cooking, with convenient online delivery.',
            }
          : path === '/new-arrivals'
            ? {
                title: 'New Nigerian Foodstuff Arrivals | Ayanfe Food Variety',
                description: 'Discover new Nigerian foodstuff arrivals, from natural pantry staples to everyday groceries, with convenient online delivery.',
              }
            : path === '/shop'
              ? {
                  title: 'Buy Nigerian Foodstuff Online | Ayanfe Food Variety',
                  description: 'Shop Nigerian foodstuff online, including natural pantry staples, grains, oils and everyday essentials with reliable delivery.',
                }
              : null
        const canonical = document.querySelector('link[rel="canonical"]')
        canonical?.setAttribute('href', `${siteUrl}${canonicalPath}`)
        if (routeMeta) {
          document.title = routeMeta.title
          document.querySelector('meta[name="description"]')?.setAttribute('content', routeMeta.description)
          document.querySelector('meta[property="og:title"]')?.setAttribute('content', routeMeta.title)
          document.querySelector('meta[property="og:description"]')?.setAttribute('content', routeMeta.description)
          document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', routeMeta.title)
          document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', routeMeta.description)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
