services:
  - type: web
    name: ayanfe-food-variety-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      # Redis caching layer. Optional — the API degrades gracefully to direct
      # database reads when this is absent. Use a managed Redis (e.g. Render
      # Redis or Upstash) and pass its TLS connection string, e.g. rediss://...
      - key: REDIS_URL
        sync: false
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_KEY_PREFIX
        value: "afvc"
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false